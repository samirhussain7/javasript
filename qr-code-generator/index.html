<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <title>QR code generator | 404Dev</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="input-container">
          <div class="logo">
            <img src="./resources/Logo.svg" alt="Logo" />
          </div>
          <div class="input">
            <input type="url" placeholder="Enter an url" name="input" />
            <button class="btn">QR code</button>
          </div>
        </div>

        <div class="output-container" hidden>
          <img src="./resources/Logo.svg" alt="QR LOGO" />
          <div class="qr-container">
            <div class="qr-bg">
              <img class="qr-code" src="" alt="" />
            </div>
          </div>
          <div class="btns">
            <a class="download" href="">Download</a>
            <button class="share">Share</button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
