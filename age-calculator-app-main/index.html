<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Age calculator app | @404Dev</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <main>
    <div class="container">
      <div class="box">
        <form class="input-box">

          <div class="arrow">
            <img src="./assets/images/icon-arrow.svg" alt="Arrow">
          </div>

          <div class="day">
            <label for="day">DAY</label>
            <input type="number" name="day" id="day" placeholder="DD" min="1" max="31">
          </div>

          <div class="month">
            <label for="month">MONTH</label>
            <input type="number" name="month" id="month" placeholder="MM" min="1" max="12">
          </div>

          <div class="year">
            <label for="year">YEAR</label>
            <input type="number" name="year" id="year" placeholder="YYYY" min="0000">
          </div>
        </form>

        <div class="output-box">
          <h4>Born in <span>--</span>/ <span>--</span>/ <span>--</span></h4>
          <h2><span>--</span> years</h2>
          <h2><span>--</span> months</h2>
          <h2><span>--</span> days</h2>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
